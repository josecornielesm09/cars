<!DOCTYPE html>
<html lang="es-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisión de animaciones | Car Haus</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{ --alto-mando: 132px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060F;color:#EDF1FA;
    font-family:"Roboto Mono",ui-monospace,monospace;overflow:hidden}
  #marco{width:100%;height:calc(100% - var(--alto-mando));border:0;display:block;background:#04060F}

  #mando{
    position:fixed;left:0;right:0;bottom:0;height:var(--alto-mando);
    background:rgba(8,12,26,.94);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.12);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:9px;
  }
  #fila{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #fila::-webkit-scrollbar{display:none}
  #fila button{
    flex:none;padding:7px 11px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(255,255,255,.18);background:transparent;color:#EDF1FA;
    font:inherit;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    transition:background .2s,border-color .2s,transform .12s;
  }
  #fila button:active{transform:scale(.96)}
  #fila button.on{background:#2F44C8;border-color:#6D86FF}
  #barra{width:100%;-webkit-appearance:none;appearance:none;height:26px;background:transparent;cursor:pointer}
  #barra::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:rgba(255,255,255,.16)}
  #barra::-moz-range-track{height:5px;border-radius:99px;background:rgba(255,255,255,.16)}
  #barra::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;
    border-radius:50%;background:#6D86FF;border:3px solid #04060F;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  #barra::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#6D86FF;border:3px solid #04060F}
  #pie{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:rgba(237,241,250,.55)}
  #pie b{color:#6D86FF;font-weight:400}
  kbd{border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 5px;font-size:9px}
</style>
</head>
<body>
<iframe id="marco" src="/?motion=on" title="Car Haus en vivo"></iframe>

<div id="mando">
  <div id="fila"></div>
  <input id="barra" type="range" min="0" max="1000" value="0" aria-label="Posición en la página">
  <div id="pie">
    <span>Arrastra, o <kbd>←</kbd> <kbd>→</kbd> para avanzar cuadro a cuadro</span>
    <span><b id="pct">0%</b> de la página</span>
  </div>
</div>

<script>
(function () {
  var marco = document.getElementById('marco');
  var barra = document.getElementById('barra');
  var fila  = document.getElementById('fila');
  var pct   = document.getElementById('pct');
  var doc, win, secciones = [];

  var NOMBRES = {
    top: 'Hero', experiencia: 'Tacoma azul', giro: 'Lo que trae',
    capacidades: 'Aguantar', inventario: 'Modelos', titulo: 'Título',
    ubicacion: 'Pie y mapa'
  };

  marco.addEventListener('load', function () {
    try {
      win = marco.contentWindow;
      doc = marco.contentDocument;
    } catch (e) { return; }

    /* La pagina de dentro no debe scrollear sola: la barra manda. */
    doc.documentElement.style.scrollBehavior = 'auto';

    secciones = Array.prototype.slice.call(doc.querySelectorAll('section, footer.foot'))
      .filter(function (s) { return s.id; });

    fila.innerHTML = '';
    secciones.forEach(function (s) {
      var b = document.createElement('button');
      b.textContent = NOMBRES[s.id] || s.id;
      b.onclick = function () { irA(s); };
      b.dataset.id = s.id;
      fila.appendChild(b);
    });
    pinta();
  });

  function total() {
    return Math.max(1, doc.documentElement.scrollHeight - win.innerHeight);
  }

  function irA(s) {
    var y = s.offsetTop;
    barra.value = Math.round(y / total() * 1000);
    aplicar();
  }

  function aplicar() {
    if (!win) return;
    var y = barra.value / 1000 * total();
    win.scrollTo(0, y);
    pct.textContent = Math.round(barra.value / 10) + '%';
    pinta();
  }

  /* Marca en que seccion cae la posicion actual. */
  function pinta() {
    if (!win) return;
    var y = win.scrollY + win.innerHeight * 0.34, cual = null;
    secciones.forEach(function (s) {
      if (y >= s.offsetTop && y < s.offsetTop + s.offsetHeight) cual = s.id;
    });
    Array.prototype.forEach.call(fila.children, function (b) {
      b.classList.toggle('on', b.dataset.id === cual);
    });
  }

  barra.addEventListener('input', aplicar);

  /* Cuadro a cuadro con el teclado: un 0.2% por pulsacion. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    barra.value = Math.max(0, Math.min(1000,
      +barra.value + (e.key === 'ArrowRight' ? 2 : -2)));
    aplicar();
  });
})();
</script>
</body>
</html>
